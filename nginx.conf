# Cấu hình Nginx cho server: /etc/nginx/sites-available/jenkins (Jenkins tự cập nhật qua deploy/update-nginx.sh)
# Muốn sửa: sửa file này trong repo rồi push, Jenkins sẽ kiểm tra (nginx -t) và reload. Đừng sửa trực tiếp trên server.
#
#   /             → frontend (container quota-frontend, 127.0.0.1:3000)
#   /api/         → gateway  (container quota-gateway,  127.0.0.1:8090), gồm cả /api/proxy/check-usage
#   /api/admin/   → API quản trị cho trang /admin (cần ADMIN_TOKEN, giới hạn tốc độ chặt hơn)
#   /jenkins      → Jenkins  (127.0.0.1:8080)
#
# HTTPS do SSL Flexible của iNet xử lý: trình duyệt ↔ iNet là HTTPS, iNet ↔ server là HTTP cổng 80,
# nên server chỉ cần listen 80 và không cần Certbot.

# Giới hạn tốc độ theo IP (file trong sites-available nằm trong khối http{} nên khai báo ở đây được).
limit_req_zone $binary_remote_addr zone=gateway_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gateway_admin:10m rate=2r/s;

server {
    listen 80;
    server_name agentshop.id.vn;

    # Request AI có thể kèm ảnh/file lớn — khớp với MAX_BODY_MB của gateway.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API quản trị key, dùng bởi trang /admin. Mọi request đều cần ADMIN_TOKEN.
    location /api/admin/ {
        limit_req zone=gateway_admin burst=20 nodelay;
        limit_req_status 429;

        # Muốn chặt hơn: chỉ cho phép IP của bạn (bỏ comment, thay IP).
        # allow 203.0.113.10;
        # deny all;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Gateway: proxy AI (/api/proxy/v1/...) và kiểm tra hạn mức (/api/proxy/check-usage).
    location /api/ {
        limit_req zone=gateway_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Streaming (SSE) cho Claude Code: không đệm, timeout dài.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /jenkins {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình tương thích với SSL Flexible từ iNet
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;

        # Hỗ trợ WebSocket
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tránh lỗi timeout
        proxy_read_timeout 90s;
    }
}
