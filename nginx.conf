# Cấu hình Nginx chuẩn cho domain https://agentshop.id.vn
# File vị trí: /etc/nginx/sites-available/agentshop.id.vn

server {
    listen 80;
    server_name agentshop.id.vn www.agentshop.id.vn;

    # 1. Định tuyến cho Tyk Gateway API (/api/...) -> Port 8081
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quan trọng khi đứng sau SSL Proxy trung gian (như iNet Flexible)
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;

        # Cấu hình hỗ trợ SSE / Streaming thời gian thực cho Claude
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 2. Định tuyến cho Giao diện React Frontend -> Port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quan trọng khi đứng sau SSL Proxy trung gian
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;

        # Hỗ trợ WebSocket (nếu React app có dùng Hot Reload hoặc Socket real-time)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}