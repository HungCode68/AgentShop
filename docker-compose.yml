services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://agentshop.id.vn/api}
    container_name: quota-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - app-net
    depends_on:
      - tyk-gateway

  tyk-gateway:
    image: docker.tyk.io/tyk-gateway/tyk-gateway:v5.5.0
    container_name: quota-tyk-gateway
    restart: always
    ports:
      - "8081:8081"
    networks:
      - app-net
    volumes:
      - ./tyk-gateway-docker/tyk.standalone.conf:/opt/tyk-gateway/tyk.conf
      - ./tyk-gateway-docker/apps:/opt/tyk-gateway/apps
      - ./tyk-gateway-docker/middleware:/opt/tyk-gateway/middleware
      - ./tyk-gateway-docker/certs:/opt/tyk-gateway/certs
      - ./tyk-gateway-docker/policies:/opt/tyk-gateway/policies
    environment:
      - TYK_GW_SECRET=${TYK_GW_SECRET:-foo}
    depends_on:
      - tyk-redis

  tyk-redis:
    image: redis:6.2.20-alpine
    container_name: quota-tyk-redis
    restart: always
    networks:
      - app-net
    volumes:
      - redis_data:/data

volumes:
  redis_data:

networks:
  app-net:
    driver: bridge
