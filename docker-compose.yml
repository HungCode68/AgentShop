services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: quota-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"

  gateway:
    build: ./gateway
    container_name: quota-gateway
    restart: always
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required (openssl rand -hex 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -hex 32)}
      # AI upstream: one revidapi account key for every customer (Jenkins Credentials: GATEWAY_REVID_API_KEY).
      REVID_API_KEY: ${REVID_API_KEY:?REVID_API_KEY is required (key sk_ of the revidapi account)}
      REVID_LOW_CREDITS: ${REVID_LOW_CREDITS:-300}
      # NVIDIA NIM Direct API Integration (Không phụ thuộc vào free-claude-code)
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-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}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      # Một model NVIDIA cho mỗi model Claude khách chọn (mỗi model có giới hạn tốc độ riêng): NVIDIA_MODEL là của Sonnet.
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      NVIDIA_MODEL_OPUS: ${NVIDIA_MODEL_OPUS:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_MODEL_HAIKU: ${NVIDIA_MODEL_HAIKU:-nvidia/nemotron-3.5-lightning-30b-a3b}
      # Request có ảnh chỉ đi qua các model nhìn được ảnh (thử lần lượt).
      NVIDIA_VISION_MODELS: ${NVIDIA_VISION_MODELS:-nvidia/nemotron-3.5-super-vl-120b-a12b,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      # Nhiều key dùng chung, cách nhau bằng dấu phẩy: xoay vòng (để trống thì dùng NVIDIA_API_KEY).
      NVIDIA_API_KEYS: ${NVIDIA_API_KEYS:-}
      NVIDIA_FIRST_BYTE_TIMEOUT_MS: ${NVIDIA_FIRST_BYTE_TIMEOUT_MS:-60000}
      # Số request cùng lúc tối đa trên MỖI key NVIDIA và mỗi model.
      MAX_NVIDIA_CONCURRENT: ${MAX_NVIDIA_CONCURRENT:-50}
      # Số request AI cùng lúc tối đa trên cả server (bảo vệ server nhỏ); vượt thì khách nhận 429 và tự thử lại. 0 = không giới hạn.
      MAX_TOTAL_CONCURRENT: ${MAX_TOTAL_CONCURRENT:-60}
      NVIDIA_CREDIT_DISCOUNT: ${NVIDIA_CREDIT_DISCOUNT:-0.3}
      # Telegram low-credit alerts (leave token/chat empty to keep the poller disabled).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_LOW_CREDITS: ${TELEGRAM_LOW_CREDITS:-500}
      TELEGRAM_ALERT_INTERVAL_MIN: ${TELEGRAM_ALERT_INTERVAL_MIN:-5}
      HEDGE_AFTER_MS: ${HEDGE_AFTER_MS:-0}
      MAX_CONCURRENT_PER_KEY: ${MAX_CONCURRENT_PER_KEY:-12}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.agentshop247.com/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://agentshop.id.vn}
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-https://agentshop.id.vn/api/proxy}
      DB_PATH: /data/gateway.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Only reachable from the server itself; the public goes through nginx.
    # 8090 instead of 8080 because Jenkins already uses 8080 on this server.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - gateway-data:/data

volumes:
  # Keeps the key database across deploys. Never run `docker compose down -v`.
  # Fixed name so the data survives a renamed Jenkins job or a different workspace directory
  # (otherwise compose prefixes the volume with the project/directory name).
  gateway-data:
    name: quota-gateway-data
