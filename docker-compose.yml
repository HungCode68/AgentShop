services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: quota-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"

  gateway:
    build: ./gateway
    container_name: quota-gateway
    restart: always
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required (openssl rand -hex 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -hex 32)}
      # AI upstream: one revidapi account key for every customer (Jenkins Credentials: GATEWAY_REVID_API_KEY).
      REVID_API_KEY: ${REVID_API_KEY:?REVID_API_KEY is required (key sk_ of the revidapi account)}
      REVID_LOW_CREDITS: ${REVID_LOW_CREDITS:-300}
      # Telegram low-credit alerts (leave token/chat empty to keep the poller disabled).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_LOW_CREDITS: ${TELEGRAM_LOW_CREDITS:-500}
      TELEGRAM_ALERT_INTERVAL_MIN: ${TELEGRAM_ALERT_INTERVAL_MIN:-5}
      HEDGE_AFTER_MS: ${HEDGE_AFTER_MS:-0}
      MAX_CONCURRENT_PER_KEY: ${MAX_CONCURRENT_PER_KEY:-8}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.agentshop247.com/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://agentshop.id.vn}
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:-https://agentshop.id.vn/api/proxy}
      DB_PATH: /data/gateway.db
    # Only reachable from the server itself; the public goes through nginx.
    # 8090 instead of 8080 because Jenkins already uses 8080 on this server.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - gateway-data:/data

volumes:
  # Keeps the key database across deploys. Never run `docker compose down -v`.
  # Fixed name so the data survives a renamed Jenkins job or a different workspace directory
  # (otherwise compose prefixes the volume with the project/directory name).
  gateway-data:
    name: quota-gateway-data
